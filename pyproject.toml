[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thirteenf-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "numpy>=1.24",
  "pandas>=2.0",
  "plotly>=5.0",
  "requests>=2.31",
  "streamlit>=1.62",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
thirteenf = "thirteenf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
